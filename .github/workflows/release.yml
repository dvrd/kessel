name: Release

on:
  push:
    branches: [main]
    # Skip releases triggered by commits that only touch paths which can't
    # change the published artifacts. A commit that touches *any* file
    # outside this list still fires the workflow normally, so mixed
    # commits (e.g. parser fix + test fixture) keep releasing.
    #
    # Not ignored on purpose:
    #   - src/**, npm/**, Taskfile.yml      — affect the shipped binary or JS
    #   - .github/workflows/release.yml     — changes here should be tested
    #                                         via a real release
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'tests/**'
      - 'bench/**'
      - 'scripts/xcheck.sh'
      - '.github/workflows/ci.yml'
      - '.github/workflows/primary-tests.yml'
      - '.github/workflows/deprecate.yml'
      - '.gitignore'
      - '.cruft/**'
  # Manual escape hatch — force a release for docs-only commits, or rerun
  # a release that was skipped by paths-ignore.
  workflow_dispatch:

# Only one release at a time. New pushes wait for the current release to finish.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # check — skip releases triggered by the release commit itself (loop guard).
  # ---------------------------------------------------------------------------
  check:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: check
        run: |
          MSG=$(git log -1 --format=%s)
          if [[ "$MSG" == release:* ]]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: HEAD is a release commit"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  verify:
    needs: check
    if: needs.check.outputs.should_release == 'true'
    uses: ./.github/workflows/primary-tests.yml
    with:
      release_checks: true

  # ---------------------------------------------------------------------------
  # version — compute the next version once, share with every downstream job.
  #
  # Sources, in order:
  #   1. Currently-published version of @dvrdlibs/kessel on the npm registry.
  #      (Authoritative — what users see.)
  #   2. Sentinel 0.1.0 if the package has never been published.
  #
  # Bump rule, from conventional commits since the last v* git tag:
  #   feat!: / refactor!: / "BREAKING CHANGE"   → major
  #   feat: / refactor:                         → minor
  #   anything else                             → patch
  # ---------------------------------------------------------------------------
  version:
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
      bump: ${{ steps.compute.outputs.bump }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for conventional-commit scanning

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - id: compute
        run: node scripts/next_release_version.js

  # ---------------------------------------------------------------------------
  # build — produce libkessel.{dylib,so,dll} for every target. One artifact
  # per platform, consumed by publish-platforms below.
  #
  # fail-fast: true — if any platform's build fails, we abort the whole
  # release. A partial set of binaries is worse than no release.
  # ---------------------------------------------------------------------------
  build:
    needs: [check, version]
    if: needs.check.outputs.should_release == 'true'
    strategy:
      fail-fast: true
      matrix: &native_targets
        include:
          - os: macos-15
            target: darwin-arm64
            # Preserve the deployment target of the published arm64 library.
            deployment_flag: -minimum-os-version:14.0.0
            ext: dylib
            ldflags: '-extra-linker-flags:"-undefined dynamic_lookup"'
          - os: macos-15-intel
            target: darwin-x64
            ext: dylib
            ldflags: '-extra-linker-flags:"-undefined dynamic_lookup"'
          - os: ubuntu-latest
            target: linux-x64
            ext: so
            ldflags: ''
          - os: ubuntu-24.04-arm
            target: linux-arm64
            ext: so
            ldflags: ''
          - os: windows-latest
            target: win32-x64
            ext: dll
            ldflags: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Odin
        uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release: dev-2026-11

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build shared library
        shell: bash
        run: |
          mkdir -p bin
          cd bin
          odin build ../src \
            ${{ matrix.deployment_flag }} -build-mode:shared \
            -out:libkessel.${{ matrix.ext }} \
            -o:speed \
            -no-bounds-check \
            ${{ matrix.ldflags }}

      # Smoke test the freshly-built binary BEFORE upload-artifact so a
      # broken native binary fails the matrix here — before any
      # `npm publish` runs in publish-platforms. The same step in ci.yml
      # catches the same class of bug on PRs, but releases run from
      # `push: main` without re-running CI, so without this step a fix
      # that passes CI can still ship broken if (e.g.) a flag, an Odin
      # nightly, or a runner-image bump introduces a regression between
      # the CI run and the release run. Adds ~30s per platform.
      #
      # The v0.4.0 x86_64 SIGSEGV (latent SIMD alignment bug exposed by
      # the new multi-line smoke source) shipped to npm precisely
      # because this step was missing.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build and smoke test CLI
        shell: bash
        run: |
          cli=kessel
          if [[ "$RUNNER_OS" == Windows ]]; then cli=kessel.exe; fi
          (cd bin && odin build ../src ${{ matrix.deployment_flag }} -out:"$cli" -o:speed -no-bounds-check)
          node tests/verifiers/verify_cli_smoke.js "bin/$cli"

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: kessel-cli-${{ matrix.target }}
          path: bin/kessel${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error

      - name: Smoke test (npm)
        shell: bash
        run: |
          cd npm/kessel
          npm ci
          node test.js

      - name: Compare CLI and npm TypeScript ASTs with Oxc
        shell: bash
        run: |
          npm ci --prefix bench --ignore-scripts --no-audit --no-fund
          node tests/verifiers/verify_npm_typescript.js --cli
          node tests/verifiers/verify_npm_typescript.js --preload-koffi

      - name: Test isolated npm bindings
        shell: bash
        run: bash tests/runners/npm_coexistence.sh

      - name: Test packed install (Node 22)
        shell: bash
        env:
          KESSEL_PACKAGE_VERSION: ${{ needs.version.outputs.version }}
        run: bash tests/runners/npm_pack_smoke.sh

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Test packed install (Node 18)
        shell: bash
        env:
          KESSEL_PACKAGE_VERSION: ${{ needs.version.outputs.version }}
        run: bash tests/runners/npm_pack_smoke.sh

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Test packed install (Node 24)
        shell: bash
        env:
          KESSEL_PACKAGE_VERSION: ${{ needs.version.outputs.version }}
        run: bash tests/runners/npm_pack_smoke.sh

      - uses: actions/upload-artifact@v4
        with:
          name: libkessel-${{ matrix.target }}
          path: bin/libkessel.${{ matrix.ext }}
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # publish-platforms — for each target, download its artifact, stage it in
  # npm/platforms/<target>/, set the version, and `npm publish`.
  #
  # fail-fast: false — if one platform fails to publish, the others still
  # complete. The publish-main job below is gated on the overall matrix
  # result; if any platform failed, main is NOT published, so users keep
  # seeing the previous main version (which references the previous,
  # complete set of sub-packages). Stranded sub-package versions on the
  # registry are dead weight but harmless.
  # ---------------------------------------------------------------------------
  publish-platforms:
    needs: [check, verify, version, build]
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read    # checkout the (private) repo — declaring any
                        # permissions resets the rest to none, so this
                        # must be explicit even though it's a default.
      id-token: write   # npm provenance attestation
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            ext: dylib
          - target: darwin-x64
            ext: dylib
          - target: linux-arm64
            ext: so
          - target: linux-x64
            ext: so
          - target: win32-x64
            ext: dll
    steps:
      - uses: actions/checkout@v4

      # No registry-url: it writes an .npmrc that authenticates with a token.
      # Publishing uses trusted publishing instead (see "Publish to npm").
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/download-artifact@v4
        with:
          name: libkessel-${{ matrix.target }}
          path: npm/platforms/${{ matrix.target }}/

      - name: Set sub-package version
        run: |
          cd npm/platforms/${{ matrix.target }}
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.version = "${{ needs.version.outputs.version }}";
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          '
          ls -la
          cat package.json

      # Trusted publishing: npm authenticates this workflow through GitHub's
      # OIDC token (id-token: write above), so there is no stored npm token to
      # expire. Each package lists dvrd/kessel and release.yml as its trusted
      # publisher on npmjs.com. Needs npm 11.5.1 or newer; Node 22 ships npm 10.
      - name: Publish to npm
        run: |
          npm install --global npm@11.21.3
          cd npm/platforms/${{ matrix.target }}
          npm publish --provenance --access public

  # ---------------------------------------------------------------------------
  # publish-main — only runs when EVERY platform sub-package succeeded.
  # Updates the main package's version + pins optionalDependencies to the
  # same version, commits + tags + pushes, then publishes.
  #
  # Order: commit/tag/push FIRST, npm publish SECOND. If the publish fails
  # after the tag is pushed, we can manually re-publish from the tag.
  # If the push fails before publish, nothing was released — we abort
  # cleanly with stranded sub-packages (recovered on next release).
  # ---------------------------------------------------------------------------
  publish-main:
    needs: [check, version, publish-platforms]
    if: |
      needs.check.outputs.should_release == 'true' &&
      needs.publish-platforms.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push commit + tag
      id-token: write   # npm provenance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # No registry-url: it writes an .npmrc that authenticates with a token.
      # Publishing uses trusted publishing instead (see "Publish to npm").
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Update main package.json
        run: |
          cd npm/kessel
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const v = "${{ needs.version.outputs.version }}";
            pkg.version = v;
            for (const k of Object.keys(pkg.optionalDependencies || {})) {
              pkg.optionalDependencies[k] = v;
            }
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          '
          cat package.json

      - name: Refresh npm lockfile
        working-directory: npm/kessel
        run: npm install --package-lock-only --ignore-scripts

      - name: Generate CHANGELOG entry
        run: |
          set -euo pipefail
          VERSION="${{ needs.version.outputs.version }}"
          TODAY=$(date +%Y-%m-%d)
          LAST_TAG=$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null || echo "")
          [[ -z "$LAST_TAG" ]] && RANGE="HEAD" || RANGE="$LAST_TAG..HEAD"

          {
            echo "## [$VERSION] - $TODAY"
            echo ""
            ALL_COMMITS=$(git log --format="- %s" "$RANGE")
            FEATS=$(grep -E "^- feat" <<< "$ALL_COMMITS" || true)
            FIXES=$(grep -E "^- fix" <<< "$ALL_COMMITS" || true)
            PERFS=$(grep -E "^- perf" <<< "$ALL_COMMITS" || true)
            [[ -n "$FEATS" ]] && printf '### Added\n%s\n\n' "$FEATS"
            [[ -n "$FIXES" ]] && printf '### Fixed\n%s\n\n' "$FIXES"
            [[ -n "$PERFS" ]] && printf '### Performance\n%s\n\n' "$PERFS"
          } > /tmp/new_entry.md

          # Prepend the new entry after the changelog header (first 5 lines
          # are convention: title + blurb + blank).
          if [[ -f CHANGELOG.md ]]; then
            HEADER=$(head -5 CHANGELOG.md)
            REST=$(tail -n +6 CHANGELOG.md)
            {
              echo "$HEADER"
              echo ""
              cat /tmp/new_entry.md
              echo "$REST"
            } > CHANGELOG.md
          else
            cp /tmp/new_entry.md CHANGELOG.md
          fi

          # Stage CHANGELOG inside npm/kessel so it ships with the package.
          cp CHANGELOG.md npm/kessel/CHANGELOG.md

      - name: Commit + tag + push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add npm/kessel/package.json npm/kessel/package-lock.json npm/kessel/CHANGELOG.md CHANGELOG.md
          git commit -m "release: v${{ needs.version.outputs.version }}"
          git tag -a "v${{ needs.version.outputs.version }}" -m "v${{ needs.version.outputs.version }}"
          git push
          git push --tags

      - name: Install dependencies
        run: cd npm/kessel && npm install --ignore-scripts

      # Trusted publishing, as in publish-platforms.
      - name: Publish to npm
        run: |
          npm install --global npm@11.21.3
          cd npm/kessel
          npm publish --provenance --access public

  verify-published:
    needs: [version, publish-main]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: *native_targets
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: libkessel-${{ matrix.target }}
          path: release-artifact
      - name: Verify published SDK from a clean consumer
        shell: bash
        env:
          KESSEL_RELEASE_VERSION: ${{ needs.version.outputs.version }}
          KESSEL_PACKAGE_BINARY: ${{ github.workspace }}/release-artifact/libkessel.${{ matrix.ext }}
        run: bash tests/runners/npm_registry_smoke.sh "$KESSEL_RELEASE_VERSION"
