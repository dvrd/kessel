name: Deprecate

# Manually deprecate a published version across the main package and all
# five platform sub-packages in one shot.
#
# Trigger: GitHub UI → Actions → Deprecate → Run workflow, then fill in
# `version` and `message`. The workflow runs once and exits; nothing is
# scheduled or recurring.
#
# Why this exists: v0.4.0 segfaulted on every x86_64 platform; the local
# `npm deprecate` flow refused without per-package passkey confirms
# because @dvrdlibs enforces 2FA on publish-class operations. Easier to
# let CI make six calls than to tap a passkey six times.
#
# Authentication. Releases publish through npm trusted publishing and need
# no token, but a trusted publisher may only publish, stage and move
# dist-tags: it cannot deprecate. So this workflow still needs a token, and
# because it runs rarely, the token should live only as long as one run:
#
#   1. npmjs.com → Access Tokens → Generate New Token → Granular Access
#      Token: read and write on the six @dvrdlibs/kessel* packages, bypass
#      2FA, expiry 1 day.
#   2. Save it as the repository secret NPM_TOKEN
#      (`gh secret set NPM_TOKEN --repo dvrd/kessel`).
#   3. Run this workflow.
#   4. Delete the secret (`gh secret delete NPM_TOKEN --repo dvrd/kessel`)
#      and let the token expire.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deprecate (e.g. 0.4.0). Applied to the main package and all five platform sub-packages.'
        required: true
        type: string
      message:
        description: 'Deprecation message shown on install. Keep it short and actionable — point users at the fixed version.'
        required: true
        type: string

# Single in-flight deprecate at a time so concurrent dispatches don't
# race on the registry's per-package writes.
concurrency:
  group: deprecate
  cancel-in-progress: false

jobs:
  deprecate:
    runs-on: ubuntu-latest
    steps:
      - name: Require a short-lived NPM_TOKEN
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::Set the NPM_TOKEN secret to a 1-day granular token first; see the comment at the top of .github/workflows/deprecate.yml."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Deprecate ${{ inputs.version }} across all six packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ inputs.version }}
          MESSAGE: ${{ inputs.message }}
        run: |
          set -eu
          # Quote-protect the message; npm deprecate takes a single arg
          # for the message body. Newlines and embedded quotes survive
          # via the env var, which we expand into the command.
          for pkg in \
            @dvrdlibs/kessel \
            @dvrdlibs/kessel-darwin-arm64 \
            @dvrdlibs/kessel-darwin-x64 \
            @dvrdlibs/kessel-linux-arm64 \
            @dvrdlibs/kessel-linux-x64 \
            @dvrdlibs/kessel-win32-x64
          do
            echo ">>> ${pkg}@${VERSION}"
            npm deprecate "${pkg}@${VERSION}" "${MESSAGE}"
          done
          echo ""
          echo "All six packages updated. Verify with:"
          echo "  npm view @dvrdlibs/kessel@${VERSION} deprecated"
