name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    uses: ./.github/workflows/primary-tests.yml
    with:
      release_checks: ${{ github.event_name == 'pull_request' }}

  playground:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: laytan/setup-odin@v2
        with:
          token: ${{ github.token }}
          release: dev-2026-11
      - uses: arduino/setup-task@v2
        with:
          version: '3.x'
          repo-token: ${{ github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the WebAssembly linker
        run: |
          if ! command -v wasm-ld >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y lld
          fi
      - name: Install headless Chromium
        working-directory: playground
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install --with-deps --only-shell chromium
      - run: task test:wasm:browser

  # Portability matrix. Proves each release target compiles cleanly and the
  # FFI binding works end-to-end. Does NOT publish anything.
  #
  # Phase 1 of the multi-target npm rollout: catch Windows / linux-arm64
  # build breakage *here* — not during a real release where a mid-matrix
  # failure would strand sub-packages on the registry at an unpublishable
  # version number.
  #
  # Target set is 5, not 6: `windows-arm64` is omitted because Odin does
  # not list it as a supported build target (Odin's Windows targets are
  # `windows_i386` and `windows_amd64` only). Revisit if upstream Odin
  # adds the target.
  #
  # `fail-fast: false` so a regression on one target doesn't mask the status
  # of the other four. Artifacts are uploaded so the eventual release
  # pipeline can consume the same contract.
  build-matrix:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: darwin-arm64
            # Preserve the deployment target of the published arm64 library.
            deployment_flag: -minimum-os-version:14.0.0
            ext: dylib
            ldflags: '-extra-linker-flags:"-undefined dynamic_lookup"'
          - os: macos-15-intel
            target: darwin-x64
            ext: dylib
            ldflags: '-extra-linker-flags:"-undefined dynamic_lookup"'
          - os: ubuntu-latest
            target: linux-x64
            ext: so
            ldflags: ''
          - os: ubuntu-24.04-arm
            target: linux-arm64
            ext: so
            ldflags: ''
          - os: windows-latest
            target: win32-x64
            ext: dll
            ldflags: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Odin
        uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release: dev-2026-11

      # Activate MSVC build environment on Windows so link.exe can find
      # Windows SDK libraries (kernel32.lib, msvcrt.lib, ...). Without
      # vcvars64.bat, the LIB env var is empty and Odin's linker
      # invocation fails with LNK1181 on a system library reference.
      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Build shared library. We inline the `odin build` invocation instead
      # of calling `task build:lib` to use the release deployment target
      # and print linker commands for each platform.
      #
      # We `cd bin` first because on Windows Odin places per-package
      # intermediate .obj files in the output directory but invokes
      # link.exe with bare filenames; CWD must match the output dir or
      # MSVC fails with LNK1181 (`cannot open input file 'system.obj'`).
      # Running from `bin/` on every platform keeps the invocation
      # uniform and harmless on macOS/Linux.
      - name: Build shared library
        shell: bash
        run: |
          mkdir -p bin
          cd bin
          odin build ../src \
            ${{ matrix.deployment_flag }} -build-mode:shared \
            -out:libkessel.${{ matrix.ext }} \
            -o:speed \
            -no-bounds-check \
            -show-system-calls \
            ${{ matrix.ldflags }}

      # npm/kessel/index.js findLib() searches ../../bin/libkessel.<ext> first
      # (the repo-root build), so the build output above is picked up without
      # any staging step.
      - name: Build and smoke test CLI
        shell: bash
        run: |
          cli=kessel
          if [[ "$RUNNER_OS" == Windows ]]; then cli=kessel.exe; fi
          (cd bin && odin build ../src ${{ matrix.deployment_flag }} -out:"$cli" -o:speed -no-bounds-check)
          node tests/verifiers/verify_cli_smoke.js "bin/$cli"
          node tests/verifiers/verify_watch.js "bin/$cli"

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: kessel-cli-${{ matrix.target }}
          path: bin/kessel${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error

      - name: Smoke test (npm)
        shell: bash
        run: |
          cd npm/kessel
          npm ci
          node test.js

      - name: Compare CLI and npm TypeScript ASTs with Oxc
        shell: bash
        run: |
          npm ci --prefix bench --ignore-scripts --no-audit --no-fund
          node tests/verifiers/verify_npm_typescript.js --cli
          node tests/verifiers/verify_npm_typescript.js --preload-koffi

      - name: Compare native TypeScript declarations
        if: matrix.target == 'linux-x64'
        run: node tests/verifiers/verify_declarations.js

      - name: Test isolated npm bindings
        shell: bash
        run: bash tests/runners/npm_coexistence.sh

      - name: Test packed install (Node 22)
        shell: bash
        run: bash tests/runners/npm_pack_smoke.sh

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Test packed install (Node 18)
        shell: bash
        run: bash tests/runners/npm_pack_smoke.sh

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Test packed install (Node 24)
        shell: bash
        run: bash tests/runners/npm_pack_smoke.sh

      - name: Package editor extension
        run: |
          npm ci --prefix editors/vscode --ignore-scripts --no-audit --no-fund
          node editors/vscode/package_vsix.js

      - name: Test installed editor extension
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a node editors/vscode/test/run.js
          else
            node editors/vscode/test/run.js
          fi

      - name: Upload editor extension
        uses: actions/upload-artifact@v4
        with:
          name: kessel-vscode-${{ matrix.target }}
          path: bin/*.vsix
          if-no-files-found: error
          retention-days: 14

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libkessel-${{ matrix.target }}
          path: bin/libkessel.${{ matrix.ext }}
          if-no-files-found: error
          retention-days: 14
